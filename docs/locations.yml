openapi: 3.1.0
info:
  title: Locations API
  description: |
    API for searching, filtering, and retrieving location data across multiple geographical hierarchies.
    Provides endpoints for location querying based on various parameters including geographical boundaries,
    administrative divisions and location types. Supports filtering, pagination, and custom field selection.
  version: 1.0.0
servers:
  - url: https://api.repliers.io
    description: Production server
  - url: https://dev.repliers.io
    description: Development server
paths:
  /locations:
    get:
      summary: Search locations
      description: Searches for geographical locations such as cities, neighborhoods, and districts. Useful for building location pickers and populating address-based filters in search interfaces. For real-time autocomplete as a user types, use the GET /locations/autocomplete endpoint instead.
      externalDocs:
        description: Locations API Implementation Guide
        url: https://help.repliers.com/en/article/locations-api-implementation-guide-s4c68b/#2-get-locations
      tags:
        - Locations
      parameters:
        - $ref: "components.yml#/components/parameters/LocationSourceFilter"

        - $ref: "components.yml#/components/parameters/LocationTypeFilter"

        - name: state
          in: query
          description: |
            Filters locations by 2-letter State/Province/Territory codes. Returns locations within the specified states.
          required: false
          schema:
            type: array
            items:
              type: string
              maxLength: 100

        - name: area
          in: query
          description: |
            Filters locations by area names. Returns locations within the specified area.
            Areas represent larger geographical divisions that may contain multiple cities and neighborhoods. Examples of Areas are counties, regions etc.
          required: false
          schema:
            type: array
            items:
              type: string
              maxLength: 100

        - name: city
          in: query
          description: |
            Filters locations by city names. Returns locations within the specified city.
            Cities can include multiple neighborhoods within their boundaries.
          required: false
          schema:
            type: array
            items:
              type: string
              maxLength: 100

        - name: neighborhood
          in: query
          description: |
            Filter results by neighborhood names. Returns specified neighborhoods.
            Neighborhoods represent the smallest geographical division in the hierarchy.
          required: false
          schema:
            type: array
            items:
              type: string
              maxLength: 100

        - name: locationId
          in: query
          description: Filters by location IDs. Location IDs can be obtained from response of [Locations Autocomplete](/reference/get_locations-autocomplete#/) endpoint
          required: false
          schema:
            type: array
            items:
              type: string
              maxLength: 30

        - name: fields
          in: query
          description: |
            Comma-separated list of fields to include in the response.
            This allows clients to request only the specific data they need, reducing payload size.
            Examples:
            - `name,type` - Returns only location names and types
            - `name,address.city,address.state` - Returns location names and specific address components
            - `map.boundary` - Returns only geographical boundary data
          required: false
          schema:
            type: string
            maxLength: 500
            example: "name,address,map.boundary"

        - name: locations
          in: query
          description: If false, the locations object will be empty. Useful for speeding up responses when aggregates are requested and locations are not needed. Default is true.
          schema:
            type: boolean

        - name: aggregates
          in: query
          description: Aggregates values and counts for specified fields. Aggregates have many use cases, they're particularly useful for grouping and displaying acceptable values for fields that are used in filters. For more information refer to <a target="_blank" href="https://help.repliers.com/en/article/using-aggregates-to-determine-acceptable-values-for-filters-c88csc">Using Aggregates To Determine Acceptable Values For Filters</a>.
          schema:
            type: string

        - name: resultsPerPage
          in: query
          description: The number of locations to return per page.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 300
            default: 100

        - name: pageNum
          in: query
          description: The page number to return. For example, with 100 results per page, specifying pageNum=2 returns results 101–200.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: map
          in: query
          description: |
            GeoJSON polygon or multi-polygon boundary for geographical filtering. Limits results to locations within the specified boundaries.
            For complex polygons or multipolygons that exceed query parameter size limits, use the POST method
            and include the map data in the request body.

            Format: Array of coordinate arrays, where each coordinate is [longitude, latitude] in WGS 84 format.
            The polygon must be closed (first and last points must be identical).

            For more information refer to the implementation guide [Filtering Listings Geo-Spatially Using the "map" Parameter](https://help.repliers.com/en/article/filtering-listings-geo-spatially-using-the-map-parameter-7sorw0/)
          required: false
          schema:
            type: string
            format: json
          example:
            [
              [
                [-79.14121, 43.79041],
                [-79.132627, 43.773059],
                [-79.188932, 43.886988],
                [-79.200605, 43.877832],
                [-79.236654, 43.869665],
                [-79.265836, 43.860011],
                [-79.281972, 43.856051],
                [-79.322828, 43.84689],
                [-79.368146, 43.839214],
                [-79.386021, 43.836139],
                [-79.41486, 43.838616],
                [-79.423787, 43.836635],
                [-79.475285, 43.82227],
                [-79.480092, 43.813352],
                [-79.480778, 43.803441],
                [-79.485585, 43.79799],
                [-79.493825, 43.794025],
                [-79.556996, 43.779649],
                [-79.601628, 43.761303],
                [-79.61611, 43.758572],
                [-79.629934, 43.750141],
                [-79.625471, 43.728064],
                [-79.616888, 43.713177],
                [-79.606245, 43.695555],
                [-79.601095, 43.685873],
                [-79.593885, 43.681156],
                [-79.590109, 43.672465],
                [-79.582212, 43.671224],
                [-79.574659, 43.670975],
                [-79.535177, 43.58325],
                [-79.424627, 43.619052],
                [-79.385488, 43.602645],
                [-79.315451, 43.612092],
                [-79.14121, 43.79041],
              ],
            ]

        - name: radius
          in: query
          description: |
            Accepts a value for radius in KM. Must be used with `lat` and `long` parameters to return locations within the specified radius of a given latitude and longitude.
          required: false
          schema:
            type: number
            format: float
            exclusiveMinimum: 0

        - name: lat
          in: query
          description: Accepts a value for latitude. Must be used with `long` parameter. When used with `radius`, returns locations within the specified radius of these coordinates.
          required: false
          schema:
            type: number
            format: float
            minimum: -90
            maximum: 90

        - name: long
          in: query
          description: Accepts a value for longitude. Must be used with `lat` parameter. When used with `radius`, returns locations within the specified radius of these coordinates.
          required: false
          schema:
            type: number
            format: float
            minimum: -180
            maximum: 180

        - name: pointWithinBoundary
          in: query
          description: |
            When set to `true`, returns only locations whose boundaries contain the point specified by `lat` and `long` parameters.
            Must be used together with `lat` and `long`.
          required: false
          schema:
            type: boolean
            default: false

        - name: sortBy
          in: query
          description: Sort results by type
          required: false
          schema:
            type: string
            enum: [typeAsc, typeDesc]

        - name: hasBoundary
          in: query
          description: |
            Only search through locations that have boundary polygons
          required: false
          schema:
            type: boolean
            default: null

        - name: minSize
          in: query
          description: Filters locations by minimum size (in square kilometers).
          required: false
          schema:
            type: number
            format: float
            exclusiveMinimum: 0

        - name: maxSize
          in: query
          description: Filters locations by maximum size (in square kilometers).
          required: false
          schema:
            type: number
            format: float
            exclusiveMinimum: 0

        - name: classification
          in: query
          description: Filters locations by classification.
          required: false
          schema:
            type: array
            items:
              type: string

        - name: subType
          in: query
          description: Filters locations by sub-type.
          required: false
          schema:
            type: array
            items:
              type: string

        - name: name
          in: query
          description: Filters locations by exact name (case-insensitive).
          required: false
          schema:
            type: string
            maxLength: 100

        - name: schoolType
          in: query
          description: Filters locations by school type. Applies to locations with `type=school`.
          required: false
          schema:
            type: array
            items:
              type: string

        - name: schoolLevel
          in: query
          description: Filters locations by school level. Applies to locations with `type=school`.
          required: false
          schema:
            type: array
            items:
              type: string

        - name: privateSchoolAffiliation
          in: query
          description: Filters locations by private school affiliation. Applies to locations with `type=school`.
          required: false
          schema:
            type: array
            items:
              type: string

        - name: schoolDistrictName
          in: query
          description: Filters locations by school district name. Applies to locations with `type=school`.
          required: false
          schema:
            type: array
            items:
              type: string

      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "components.yml#/components/schemas/PaginationInfo"
                  - type: object
                    properties:
                      source:
                        type: array
                        description: Sources present in the result set.
                        items:
                          type: string
                          enum: [MLS, UserDefined, LiveBy, PublicRecord]
                      locations:
                        type: array
                        items:
                          $ref: "#/components/schemas/Location"

        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /locations/autocomplete:
    get:
      summary: Locations autocomplete
      description: Autocomplete for Locations search. As your user types,
        you simply pass their input into search param and get locations which match their input.
        You can use other params to fine-tune the locations which will be returned for a given search.
      externalDocs:
        description: Building an Autocomplete Search Feature
        url: https://help.repliers.com/en/article/building-an-autocomplete-search-feature-with-repliers-apis-1eaoxyl/
      tags:
        - Locations
      parameters:
        - name: search
          in: query
          description: Search query string
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 100
            example: "Sacrame"

        - $ref: "components.yml#/components/parameters/LocationSourceFilter"

        - $ref: "components.yml#/components/parameters/LocationTypeFilter"

        - name: fields
          in: query
          description: |
            Comma-separated list of fields to include in the response.
            This allows clients to request only the specific data they need, reducing payload size.
            Examples:
            - `name,type` - Returns only location names and types
            - `name,address.city,address.state` - Returns location names and specific address components
            - `map.boundary` - Returns only geographical boundary data
          required: false
          schema:
            type: string
            maxLength: 500
            example: "name,address.city,address.state"

        - name: map
          in: query
          description: |
            GeoJSON polygon or multi-polygon boundary for geographical filtering. Limits results to locations within the specified boundaries.
            For complex polygons or multipolygons that exceed query parameter size limits, use the POST method
            and include the map data in the request body.

            Format: Array of coordinate arrays, where each coordinate is [longitude, latitude] in WGS 84 format.
            The polygon must be closed (first and last points must be identical).

            For more information refer to the implementation guide  [Filtering Listings Geo-Spatially Using the "map" Parameter](https://help.repliers.com/en/article/filtering-listings-geo-spatially-using-the-map-parameter-7sorw0/)
          required: false
          schema:
            type: string
            format: json
          example:
            [
              [
                [-79.14121, 43.79041],
                [-79.132627, 43.773059],
                [-79.188932, 43.886988],
                [-79.200605, 43.877832],
                [-79.236654, 43.869665],
                [-79.265836, 43.860011],
                [-79.281972, 43.856051],
                [-79.322828, 43.84689],
                [-79.368146, 43.839214],
                [-79.386021, 43.836139],
                [-79.41486, 43.838616],
                [-79.423787, 43.836635],
                [-79.475285, 43.82227],
                [-79.480092, 43.813352],
                [-79.480778, 43.803441],
                [-79.485585, 43.79799],
                [-79.493825, 43.794025],
                [-79.556996, 43.779649],
                [-79.601628, 43.761303],
                [-79.61611, 43.758572],
                [-79.629934, 43.750141],
                [-79.625471, 43.728064],
                [-79.616888, 43.713177],
                [-79.606245, 43.695555],
                [-79.601095, 43.685873],
                [-79.593885, 43.681156],
                [-79.590109, 43.672465],
                [-79.582212, 43.671224],
                [-79.574659, 43.670975],
                [-79.535177, 43.58325],
                [-79.424627, 43.619052],
                [-79.385488, 43.602645],
                [-79.315451, 43.612092],
                [-79.14121, 43.79041],
              ],
            ]

        - name: resultsPerPage
          in: query
          description: The number of locations to return per page.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 10

        - name: radius
          in: query
          description: |
            Accepts a value for radius in KM. Must be used with `lat` and `long` parameters to return locations within the specified radius of a given latitude and longitude.
          required: false
          schema:
            type: number
            format: float
            exclusiveMinimum: 0

        - name: lat
          in: query
          description: Accepts a value for latitude. Must be used with `long` parameter. When used with `radius`, returns locations within the specified radius of these coordinates.
          required: false
          schema:
            type: number
            format: float
            minimum: -90
            maximum: 90

        - name: long
          in: query
          description: Accepts a value for longitude. Must be used with `lat` parameter. When used with `radius`, returns locations within the specified radius of these coordinates.
          required: false
          schema:
            type: number
            format: float
            minimum: -180
            maximum: 180

        - name: state
          in: query
          description: |
            Filters locations by 2-letter State/Province/Territory codes. Returns locations within the specified states.
          required: false
          schema:
            type: array
            items:
              type: string
              maxLength: 100

        - name: area
          in: query
          description: |
            Searches for locations only inside specified areas.
            Areas represent larger geographical divisions that may contain multiple cities and neighborhoods. Examples of Areas are counties, regions etc.
          required: false
          schema:
            type: array
            items:
              type: string
              maxLength: 100

        - name: city
          in: query
          description: |
            Searches for locations only inside specified cities.
            Cities can include multiple neighborhoods within their boundaries.
          required: false
          schema:
            type: array
            items:
              type: string
              maxLength: 100

        - name: boundary
          in: query
          description: |
            Fetches locations with boundary polygons for a small performance penalty of 10-20ms
          required: false
          schema:
            type: boolean
            default: null

        - name: hasBoundary
          in: query
          description: |
            Only search through locations that have boundary polygons
          required: false
          schema:
            type: boolean
            default: null

        - name: minSize
          in: query
          description: Filters locations by minimum size (in square kilometers).
          required: false
          schema:
            type: number
            format: float
            exclusiveMinimum: 0

        - name: maxSize
          in: query
          description: Filters locations by maximum size (in square kilometers).
          required: false
          schema:
            type: number
            format: float
            exclusiveMinimum: 0

        - name: classification
          in: query
          description: Filters locations by classification.
          required: false
          schema:
            type: array
            items:
              type: string

        - name: subType
          in: query
          description: Filters locations by sub-type.
          required: false
          schema:
            type: array
            items:
              type: string

      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "components.yml#/components/schemas/PaginationInfo"
                  - type: object
                    properties:
                      source:
                        type: array
                        description: Sources present in the result set.
                        items:
                          type: string
                          enum: [MLS, UserDefined, LiveBy, PublicRecord]
                      locations:
                        type: array
                        items:
                          $ref: "#/components/schemas/Location"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    Coordinate:
      type: array
      minItems: 2
      maxItems: 2
      items:
        type: number
        format: double
      example: [-79.491105, 43.979703]
      description: |
        A longitude/latitude coordinate pair in WGS 84 format.
        Format: [longitude, latitude] where:
        - Longitude ranges from -180 to +180 degrees (negative for western hemisphere)
        - Latitude ranges from -90 to +90 degrees (negative for southern hemisphere)

    LocationAddress:
      type: object
      description: |
        Structured representation of a location's address components.
      properties:
        country:
          type: string
          description: Country name (e.g. "CA", "US")
        state:
          type: string
          description: State or province name (e.g. "ON", "CA")
        city:
          type: string
          description: City name (e.g. "New York", "Vancouver")
        area:
          type: string
          description: County or Region name (e.g. "Orange County", "York")
        neighborhood:
          type: string
          description: Specific neighborhood name (smallest geographical unit)
        zip:
          type: string
          description: Postal or ZIP code, if applicable to this location.
        zipPlus4:
          type: string
          nullable: true
          description: The ZIP+4 extension, if available.
        street:
          type: string
          nullable: true
          description: The street name, for property-type (parcel) locations.
        streetAddress:
          type: string
          nullable: true
          description: The full street address, for property-type (parcel) locations.

    SuggestedLocation:
      type: object
      properties:
        locationId:
          type: string
          description: Unique identifier for the location
        name:
          type: string
          description: Human-readable display name for the location
        type:
          $ref: "components.yml#/components/schemas/LocationType"
        classification:
          type: string
          description: Classification of the location
        subType:
          type: string
          description: Sub-type of the location
        size:
          type: number
          format: float
          description: Size of the location in square kilometers
        map:
          type: object
          properties:
            latitude:
              type: string
            longitude:
              type: string
            point:
              type: string
              description: "A WKT point representation of the coordinates, e.g. \"POINT (-79.49 43.98)\"."
            geometryType:
              type: string
              nullable: true
              description: The type of the boundary geometry (e.g. Polygon, MultiPolygon), if a boundary is present.
            boundary:
              type: array
              items:
                $ref: "#/components/schemas/Coordinate"
          required: [latitude, longitude]
        address:
          $ref: "#/components/schemas/LocationAddress"

    Location:
      type: object
      description: |
        Complete location information including identifiers, type classification,
        address components, and geographical coordinates/boundaries.
      properties:
        locationId:
          type: string
          description: Unique identifier for the location
        name:
          type: string
          description: Human-readable display name for the location
        type:
          $ref: "components.yml#/components/schemas/LocationType"
        subType:
          type: string
          nullable: true
          description: A finer-grained classification within `type`, if applicable.
        source:
          type: string
          nullable: true
          description: "The source of this location record. Allowed values: MLS, UserDefined, LiveBy, PublicRecord."
        liveById:
          type: string
          nullable: true
          description: The identifier for this location in LiveBy, the demographic data provider, if source is LiveBy.
        mlsId:
          type: string
          nullable: true
          description: The identifier for this location in the originating MLS, if source is MLS.
        size:
          type: number
          format: float
          description: Size of the location in square kilometers
        map:
          type: object
          description: Geographical information including coordinates and boundary data
          properties:
            latitude:
              type: string
              description: Latitude coordinate of the location's center point
            longitude:
              type: string
              description: Longitude coordinate of the location's center point
            point:
              type: string
              description: WKT (Well-Known Text) representation of the location's center point
              example: "POINT (-79.43510859999999 43.71805260000001)"
            geometryType:
              type: string
              nullable: true
              description: The type of the boundary geometry (e.g. Polygon, MultiPolygon), if a boundary is present.
            boundary:
              type: array
              description: |
                GeoJSON polygon defining the location's geographical boundary.
              items:
                type: array
                items:
                  $ref: "#/components/schemas/Coordinate"
        address:
          $ref: "#/components/schemas/LocationAddress"
        demographics:
          description: Demographic statistics for this location, where available.
          type: object
          properties:
            age:
              description: Population counts by age bracket.
              type: object
              properties:
                byCohort:
                  description: Broken down by fine-grained bracket.
                  type: object
                  properties:
                    between0To4:
                      type: integer
                    between5To9:
                      type: integer
                    between10To14:
                      type: integer
                    between15To19:
                      type: integer
                    between20To24:
                      type: integer
                    between25To29:
                      type: integer
                    between30To34:
                      type: integer
                    between35To39:
                      type: integer
                    between40To44:
                      type: integer
                    between45To49:
                      type: integer
                    between50To54:
                      type: integer
                    between55To59:
                      type: integer
                    between60To64:
                      type: integer
                    between65To69:
                      type: integer
                    between70To74:
                      type: integer
                    between75To79:
                      type: integer
                    between80To84:
                      type: integer
                    between85AndOver:
                      type: integer
                byLifeStage:
                  description: Broken down by broad life-stage bracket.
                  type: object
                  properties:
                    between0To9:
                      type: integer
                    between10To17:
                      type: integer
                    between18To24:
                      type: integer
                    between25To64:
                      type: integer
                    between65To74:
                      type: integer
                    between75AndOver:
                      type: integer
            rent:
              description: Household counts by monthly rent bracket.
              type: object
              properties:
                over999:
                  type: integer
                under499:
                  type: integer
                between500To749:
                  type: integer
                between750To999:
                  type: integer
            rooms:
              description: Household counts by number of bedrooms.
              type: object
              properties:
                studio:
                  type: integer
                oneBedroom:
                  type: integer
                twoBedrooms:
                  type: integer
                threeBedrooms:
                  type: integer
                fourBedroomsOrMore:
                  type: integer
            income:
              description: Population counts by household income bracket.
              type: object
              properties:
                byLevel:
                  description: Broken down by income level bracket.
                  type: object
                  properties:
                    over100000:
                      type: integer
                    between0To25000:
                      type: integer
                    between25000To35000:
                      type: integer
                    between35000To50000:
                      type: integer
                    between50000To75000:
                      type: integer
                    between75000To100000:
                      type: integer
                byCohort:
                  description: Broken down by fine-grained bracket.
                  type: object
                  properties:
                    over200k:
                      type: integer
                    between0To10k:
                      type: integer
                    between10kTo15k:
                      type: integer
                    between15kTo20k:
                      type: integer
                    between20kTo25k:
                      type: integer
                    between25kTo30k:
                      type: integer
                    between30kTo35k:
                      type: integer
                    between35kTo40k:
                      type: integer
                    between40kTo45k:
                      type: integer
                    between45kTo50k:
                      type: integer
                    between50kTo60k:
                      type: integer
                    between60kTo75k:
                      type: integer
                    between75kTo100k:
                      type: integer
                    between100kTo125k:
                      type: integer
                    between125kTo150k:
                      type: integer
                    between150kTo200k:
                      type: integer
            jobType:
              description: Population counts by job type.
              type: object
              properties:
                blueCollar:
                  type: integer
                whiteCollar:
                  type: integer
            metadata:
              description: Metadata about the source of this demographic data.
              type: object
              properties:
                source:
                  type: string
                attribution:
