openapi: 3.1.0
info:
  title: Members API
  version: 1.0.0
servers:
  - url: https://api.repliers.io
paths:
  /members:
    get:
      summary: Members
      description: Use this endpoint to list and filter members (agents) belonging to the MLS.
      externalDocs:
        description: Understanding the Members Endpoint
        url: https://help.repliers.com/en/article/understanding-the-members-endpoint-cpc4c/#1-overview
      operationId: members
      parameters:
        - name: agentId
          in: query
          description: Filters members by agent ID using exact match.
          schema:
            type: string
        - name: agentName
          in: query
          description: Filters members by agent name using exact match.
          schema:
            type: string
        - name: boardId
          in: query
          description: Filters members by the MLS board they belong to.
          schema:
            type: string
        - name: hasEmail
          in: query
          description: If supplied, filters members by whether they have an email address on record.
          schema:
            type: boolean
        - name: originatingSystemName
          in: query
          description: Filters members by the name of the originating MLS system.
          schema:
            type: string
        - name: brokerage
          in: query
          description: Filters members by brokerage name using partial match.
          schema:
            type: string
        - name: officeId
          in: query
          description: Filters members by the ID of the office they belong to.
          schema:
            type: string
        - name: position
          in: query
          description: Filters members by their position or role.
          schema:
            type: string
        - name: keywords
          in: query
          description: Searches members by keyword across multiple fields.
          schema:
            type: string
        - name: pageNum
          in: query
          description: The page number to return. For example, with 100 results per page, specifying pageNum=2 returns results 101–200.
          schema:
            type: integer
            format: int32
            default: 1
            maximum: 10000
        - name: resultsPerPage
          in: query
          description: The number of members to return per page.
          schema:
            type: integer
            format: int32
            default: 100
            maximum: 1000
      responses:
        "200":
          description: Successful response containing a paginated list of members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: components.yml#/components/schemas/PaginationInfo
                  - type: object
                    properties:
                      members:
                        type: array
                        description: Array of member objects
                        items:
                          type: object
                          properties:
                            resource:
                              type: string
                              example: "Property:1"
                              description: Resource identifier
                            resourceId:
                              type: [string, "null"]
                              example: "1"
                              description: Identifier of the resource this member record relates to.
                            agentId:
                              type: string
                              example: "10000000000000000001"
                              description: Unique identifier for the agent
                            boardAgentId:
                              type: string
                              example: agent1
                              description: Agent identifier assigned by the MLS board
                            officeId:
                              type: [string, "null"]
                              example: "20000000000000000001"
                              description: Identifier of the office the member belongs to
                            updatedOn:
                              type: [string, "null"]
                              example: "2024-06-15T12:00:00.000Z"
                              description: Timestamp of the last update
                            name:
                              type: string
                              example: Jamie Brown
                              description: Full name of the member
                            board:
                              type: [string, "null"]
                              description: MLS board the member belongs to
                            position:
                              type: [string, "null"]
                              example: Full-time
                              description: Position or role of the member
                            status:
                              type: [string, "null"]
                              example: Active
                              description: The status of this member record (e.g. active, deleted).
                            stateLicense:
                              type: [string, "null"]
                              example: "0000000"
                              description: The member's state license number, if on record.
                            mlsName:
                              type: [string, "null"]
                              example: HAR
                              description: The name of the MLS/board this member record originates from.
                            phones:
                              type: array
                              description: List of phone numbers for the member
                              items:
                                type: string
                                example: "15555550100"
                            social:
                              type: array
                              description: List of social media profiles
                              items:
                                type: string
                            website:
                              type: [string, "null"]
                              description: Member's website URL
                            photo:
                              type: object
                              description: Profile photo URLs
                              properties:
                                small:
                                  type: [string, "null"]
                                  description: URL of the small-sized photo
                                large:
                                  type: [string, "null"]
                                  description: URL of the large-sized photo
                                updatedOn:
                                  type: [string, "null"]
                                  description: Timestamp of the last photo update
                            brokerage:
                              type: object
                              description: Brokerage the member is associated with
                              properties:
                                name:
                                  type: [string, "null"]
                                  example: Northshore Brokerage
                                  description: Name of the brokerage
                                address:
                                  type: object
                                  description: Address of the brokerage
                                  properties:
                                    address1:
                                      type: [string, "null"]
                                      example: "896 King St W"
                                      description: Primary address line
                                    address2:
                                      type: [string, "null"]
                                      description: Secondary address line
                                    city:
                                      type: [string, "null"]
                                      example: Houston
                                      description: City name
                                    state:
                                      type: [string, "null"]
                                      example: TX
                                      description: State or province
                                    postal:
                                      type: [string, "null"]
                                      example: "77002"
                                      description: Postal or ZIP code
                                    country:
                                      type: [string, "null"]
                                      description: Country name
                                officeBroker:
                                  type: [string, "null"]
                                  example: Summit Real Estate
                                  description: Name of the office's broker of record.
                                officeBrokerKey:
                                  type: [string, "null"]
                                  example: "20000000000000000001"
                                  description: MLS-assigned key identifying the office's broker of record.
                                officeBrokerMlsId:
                                  type: [string, "null"]
                                  example: MLS01
                                  description: MLS identifier for the office's broker of record.
                                officeManager:
                                  type: [string, "null"]
                                  description: Name of the office's manager.
                                officeManagerKey:
                                  type: [string, "null"]
                                  description: MLS-assigned key identifying the office's manager.
                                officeManagerMlsId:
                                  type: [string, "null"]
                                  description: MLS identifier for the office's manager.
                                officeKey:
                                  type: [string, "null"]
                                  example: "20000000000000000001"
                                  description: MLS-assigned key identifying the office.
                                officeMlsId:
                                  type: [string, "null"]
                                  example: MLS01
                                  description: MLS identifier for the office.
                                mainOfficeKey:
                                  type: [string, "null"]
                                  description: MLS-assigned key identifying the office's main/parent office, if part of a multi-office brokerage.
                                mainOfficeMlsId:
                                  type: [string, "null"]
                                  description: MLS identifier for the office's main/parent office, if part of a multi-office brokerage.
                                officeBrokerEmail:
                                  type: [string, "null"]
                                  example: jordan.smith@example.com
                                  description: Email address of the office's broker of record.
                                officeManagerEmail:
                                  type: [string, "null"]
                                  description: Email address of the office's manager.
                            email:
                              type: [string, "null"]
                              example: taylor.chen@example.com
                              description: Email address of the member
        "400":
          $ref: components.yml#/components/responses/BadRequest
        "401":
          $ref: components.yml#/components/responses/Unauthorized
      deprecated: false
