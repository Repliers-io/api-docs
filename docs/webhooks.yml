openapi: 3.1.0
info:
  title: Webhooks API
  version: 1.0.0
servers:
  - url: https://api.repliers.io
paths:
  /webhooks:
    post:
      summary: Create a subscription
      description: "Use this endpoint to subscribe to a webhook.<br/><br/><strong>Verification handshake</strong> - when a subscription is created, the API sends a POST request to the <code>target_url</code> with an <code>X-Hook-Secret</code> header. Your endpoint must respond with the same <code>X-Hook-Secret</code> header and value. If the secret is not echoed back the request fails with a 401 error, and if the target_url cannot be reached it fails with a 400 error.<br/><br/>A <code>target_url</code> that is already used by another subscription is rejected with a 409 error. Sandbox API keys cannot create subscriptions and receive a 403 error."
      externalDocs:
        description: How to Subscribe to Events
        url: https://help.repliers.com/en/article/webhooks-implementation-guide-oimchm/#3-how-to-subscribe-to-events
      operationId: create-a-webhook
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - target_url
                - event
              properties:
                target_url:
                  type: string
                  description: This value must be unique, you may not specify the same target url for more than one webhook.
                event:
                  type: string
                  description: "Allowed values: <br/><br/> <code>agent.created</code>, <code>agent.updated</code>, <code>agent.deleted</code>, <code>client.created</code>, <code>client.updated</code>, <code>client.deleted</code>, <code>search.created</code>, <code>search.updated</code>, <code>search.deleted</code>, <code>search.match.created</code>, <code>search.match.updated</code>, <code>message.created</code>,<code>listing.created</code>, <code>listing.updated</code>, <code>listing.deleted</code>, <code>favorite.created</code>, <code>favorite.deleted</code>"
                configuration:
                  type: object
                  description: Configuration options for the webhook. Unknown properties are rejected with a 400 error.
                  additionalProperties: false
                  properties:
                    raw:
                      type: boolean
                      description: If true, the event payload includes the raw MLS data.
                    filters:
                      type: array
                      description: Only deliver events whose payload matches all of the supplied filters.
                      items:
                        type: object
                        additionalProperties: false
                        required:
                          - field
                          - values
                        properties:
                          field:
                            type: string
                            description: The payload field to filter on.
                          logic:
                            type: string
                            description: The comparison to apply. Defaults to an exact match when omitted.
                            enum:
                              - contains
                          values:
                            type: array
                            description: The values to match against.
                            items:
                              type: string
            examples:
              Request Example:
                value:
                  event: listing.created
                  target_url: <target_url>
                  configuration:
                    filters:
                      - field: address.city
                        values:
                          - Toronto
      responses:
        "200":
          description: "200"
          content:
            application/json:
              examples:
                Result:
                  value: |-
                    {
                      "id": 438,
                      "target_url": "https://webhook-repliers.com",
                      "event": "listing.created",
                      "configuration": {
                        "filters": [
                          {
                            "field": "address.city",
                            "values": [
                              "Toronto"
                            ]
                          }
                        ]
                      }
                    }
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 438
                    default: 0
                  target_url:
                    type: string
                    example: https://webhook-repliers.com
                  event:
                    type: string
                    example: listing.created
                  configuration:
                    type: object
                    properties:
                      filters:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                              example: address.city
                            values:
                              type: array
                              items:
                                type: string
                                example: Toronto
        "400":
          $ref: components.yml#/components/responses/BadRequest
        "401":
          $ref: components.yml#/components/responses/Unauthorized
        "403":
          description: Webhooks are not enabled for this API key, or the API key is a sandbox key. Contact the Repliers support team to enable the feature.
        "409":
          description: The target_url is already used by another webhook subscription.
      deprecated: false
    get:
      summary: List subscriptions
      description: Use this endpoint to retrieve a list of webhook subscriptions.
      operationId: list-subscriptions
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
        "400":
          $ref: components.yml#/components/responses/BadRequest
        "401":
          $ref: components.yml#/components/responses/Unauthorized
        "403":
          description: Webhooks are not enabled for this API key. Contact the Repliers support team to enable the feature.
      deprecated: false
  /webhooks/{webhookId}:
    patch:
      summary: Update a subscription
      description: Use this endpoint to update an existing webhook subscription. The request body must contain at least one property, and unknown properties are rejected with a 400 error. PUT /webhooks/{webhookId} behaves identically.
      operationId: update-a-subscription
      parameters: &WebhookUpdateParams
        - name: webhookId
          in: path
          schema:
            type: integer
            format: int32
          required: true
      requestBody: &WebhookUpdateBody
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target_url:
                  type: string
                  description: This value must be unique, you may not specify the same target url for more than one webhook.
                event:
                  type: string
                  description: "Allowed values: <br/><br/> <code>agent.created</code>, <code>agent.updated</code>, <code>agent.deleted</code>, <code>client.created</code>, <code>client.updated</code>, <code>client.deleted</code>, <code>search.created</code>, <code>search.updated</code>, <code>search.deleted</code>, <code>search.match.created</code>, <code>search.match.updated</code>, <code>message.created</code>,<code>listing.created</code>, <code>listing.updated</code>, <code>listing.deleted</code>, <code>favorite.created</code>, <code>favorite.deleted</code>"
                configuration:
                  type: object
                  description: Configuration options for the webhook. Unknown properties are rejected with a 400 error.
                  additionalProperties: false
                  properties:
                    raw:
                      type: boolean
                      description: If true, the event payload includes the raw MLS data.
                    filters:
                      type: array
                      description: Only deliver events whose payload matches all of the supplied filters.
                      items:
                        type: object
                        additionalProperties: false
                        required:
                          - field
                          - values
                        properties:
                          field:
                            type: string
                            description: The payload field to filter on.
                          logic:
                            type: string
                            description: The comparison to apply. Defaults to an exact match when omitted.
                            enum:
                              - contains
                          values:
                            type: array
                            description: The values to match against.
                            items:
                              type: string
      responses: &WebhookUpdateResponses
        "200":
          $ref: components.yml#/components/responses/EmptySuccess
        "400":
          $ref: components.yml#/components/responses/BadRequest
        "401":
          $ref: components.yml#/components/responses/Unauthorized
        "403":
          description: Webhooks are not enabled for this API key. Contact the Repliers support team to enable the feature.
      deprecated: false
    put:
      summary: Update a subscription (PUT)
      description: Identical to PATCH /webhooks/{webhookId}. Updates an existing webhook subscription. The request body must contain at least one property, and unknown properties are rejected with a 400 error.
      operationId: update-a-subscription-put
      parameters: *WebhookUpdateParams
      requestBody: *WebhookUpdateBody
      responses: *WebhookUpdateResponses
      deprecated: false
    delete:
      summary: Delete a subscription
      description: Use this endpoint to delete an existing webhook subscription.
      operationId: delete-a-subscription
      parameters:
        - name: webhookId
          in: path
          schema:
            type: integer
            format: int32
          required: true
      responses:
        "200":
          $ref: components.yml#/components/responses/EmptySuccess
        "400":
          $ref: components.yml#/components/responses/BadRequest
        "401":
          $ref: components.yml#/components/responses/Unauthorized
        "403":
          description: Webhooks are not enabled for this API key. Contact the Repliers support team to enable the feature.
      deprecated: false
    get:
      summary: Get a subscription
      description: Use this endpoint to get details associated with a specific webhook subscription.
      operationId: get-a-subscription
      parameters:
        - name: webhookId
          in: path
          schema:
            type: integer
            format: int32
          required: true
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          $ref: components.yml#/components/responses/BadRequest
        "401":
          $ref: components.yml#/components/responses/Unauthorized
        "403":
          description: Webhooks are not enabled for this API key. Contact the Repliers support team to enable the feature.
      deprecated: false
  /webhooks/events:
    get:
      summary: List events
      description: Use this endpoint to retrieve a list of webhook events that you may subscribe to.
      externalDocs:
        description: Supported Events
        url: https://help.repliers.com/en/article/webhooks-implementation-guide-oimchm/#3-supported-events
      operationId: list-events
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: array
                items: &WebhookEvent
                  type: object
                  properties:
                    name:
                      type: string
                      example: message.created
                      description: "The event name, e.g. agent.created (see the event list on POST /webhooks)."
                    description:
                      type: string
                      example: Fires when a new message is sent.
                      description: A human-readable description of when this event fires.
                    samplePayload:
                      type: object
                      description: An example of the payload delivered to your target_url when this event fires.
                      properties:
                        data:
                          type: object
                          description: The resource data for this event. Its shape depends on the event — e.g. an agent.* event's data looks like an Agent object, a message.* event's looks like a Message object.
                        hook:
                          type: object
                          description: Metadata about the webhook subscription that produced this delivery.
                          properties:
                            id:
                              type: integer
                              format: int32
                              example: 438
                              description: The subscription's webhookId.
                            event:
                              type: string
                              example: message.created
                              description: The event name this subscription is subscribed to.
                            header:
                              type: string
                              example: X-Hook-Secret
                              description: The header name used for the verification handshake (X-Hook-Secret).
                            secret:
                              type: string
                              example: a1b2c3d4e5f6
                              description: The secret value used for the verification handshake.
                            target_url:
                              type: string
                              example: https://webhook-repliers.com
                              description: The subscription's target_url.
        "400":
          $ref: components.yml#/components/responses/BadRequest
        "401":
          $ref: components.yml#/components/responses/Unauthorized
        "403":
          description: Webhooks are not enabled for this API key. Contact the Repliers support team to enable the feature.
      deprecated: false
  /webhooks/events/{name}:
    get:
      summary: Get an event
      description: Use this endpoint to retrieve the details of a single webhook event that you may subscribe to, including a sample payload.
      operationId: get-an-event
      parameters:
        - name: name
          in: path
          description: The event name, for example listing.created. See the event list on POST /webhooks.
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema: *WebhookEvent
        "400":
          $ref: components.yml#/components/responses/BadRequest
        "401":
          $ref: components.yml#/components/responses/Unauthorized
        "403":
          description: Webhooks are not enabled for this API key. Contact the Repliers support team to enable the feature.
        "404":
          description: No event with the supplied name exists.
      deprecated: false
components:
  schemas:
    Webhook:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 438
          description: The unique identifier of the webhook subscription (webhookId).
        target_url:
          type: string
          example: https://webhook-repliers.com
          description: The URL that event notifications are delivered to.
        event:
          type: string
          example: listing.created
          description: "The event this subscription is subscribed to. Allowed values: <br/><br/> <code>agent.created</code>, <code>agent.updated</code>, <code>agent.deleted</code>, <code>client.created</code>, <code>client.updated</code>, <code>client.deleted</code>, <code>search.created</code>, <code>search.updated</code>, <code>search.deleted</code>, <code>search.match.created</code>, <code>search.match.updated</code>, <code>message.created</code>,<code>listing.created</code>, <code>listing.updated</code>, <code>listing.deleted</code>, <code>favorite.created</code>, <code>favorite.deleted</code>"
        configuration:
          type: object
          description: Configuration options for the webhook, such as delivery filters.
          properties:
            filters:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: address.city
                  values:
                    type: array
                    items:
                      type: string
                      example: Toronto
