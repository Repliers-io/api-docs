openapi: 3.1.0
info:
  title: Messages API
  version: 1.0.0
servers:
  - url: https://api.repliers.io
paths:
  /messages:
    post:
      summary: Send a message
      description: |-
        Use this endpoint to send a message.

        A message is either sent from an agent to a client, or from a client to an agent.

        Messages can be used to facilitate communication between agents and their clients for marketing automation or general communication.

        Text messaging and email is supported.
      externalDocs:
        description: Send a Message
        url: https://help.repliers.com/en/article/how-to-send-your-first-message-using-repliers-f93kbg/#2-step-3-send-a-message
      operationId: send-a-message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - sender
                - agentId
                - clientId
              properties:
                sender:
                  type: string
                  description: Indicates whether the agent is sending the message or the client.<br/><br/>Allowed values:<br/><br/><code>agent</code>,<code>client</code>
                agentId:
                  type: integer
                  description: The agentId of the agent that's either receiving or sending the message.
                  format: int32
                clientId:
                  type: integer
                  description: The clientId of the client that's either receiving or sending the message.
                  format: int32
                content:
                  properties:
                    listings:
                      type: array
                      description: An array of listings (mlsNumbers) to send in this message.
                      items:
                        type: string
                    searches:
                      type: array
                      description: An array of saved searches (searchIds) to send in this message. Active listings that match filters for each search specified will be sent in this message.
                      items:
                        type: integer
                        format: int32
                    message:
                      type: string
                      description: Content to be sent with this message. For example, "hi, how are you today?"
                    subject:
                      type: string
                      description: If specified, changes the email subject from the default
                    links:
                      type: array
                      description: An array of links (URLs) to be sent in this message.
                      items:
                        type: string
                    pictures:
                      type: array
                      description: An array of pictures (URLs) to be sent in this message.
                      items:
                        type: string
                  required: []
                  type: object
      responses:
        "200":
          $ref: components.yml#/components/responses/EmptySuccess
        "400":
          $ref: components.yml#/components/responses/BadRequest
        "401":
          $ref: components.yml#/components/responses/Unauthorized
      deprecated: false
    get:
      summary: Filter messages
      description: Use this endpoint to list and filter sent messages.
      operationId: filter-messages
      parameters:
        - name: agentId
          in: query
          schema:
            type: integer
            format: int32
        - name: clientId
          in: query
          schema:
            type: integer
            format: int32
        - name: endTime
          in: query
          description: If specified, filters messages which were sent  on or before the supplied value.
          schema:
            type: string
            format: date
        - name: startTime
          in: query
          description: If specified, filters messages which were sent on or after the supplied value.
          schema:
            type: string
            format: date
        - name: message
          in: query
          schema:
            type: string
        - name: messageId
          in: query
          schema:
            type: integer
            format: int32
        - name: pageNum
          in: query
          description: The page number to return. For example, with 100 results per page, specifying pageNum=2 returns results 101–200.
          schema:
            type: integer
            format: int32
            default: 1
        - name: resultsPerPage
          in: query
          description: The number of messages to return per page.
          schema:
            type: integer
            format: int32
            default: 100
        - name: sender
          in: query
          description: Allowed values:<br/><br/><code>agent</code>,<code>client</code>
          schema:
            type: string
        - name: status
          in: query
          description: Allowed values:<br/><br/><code>sent</code>,<code>pending</code>
          schema:
            type: string
        - name: token
          in: query
          schema:
            type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    type: integer
                  numPages:
                    type: integer
                  pageSize:
                    type: integer
                  count:
                    type: integer
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
        "400":
          $ref: components.yml#/components/responses/BadRequest
        "401":
          $ref: components.yml#/components/responses/Unauthorized
      deprecated: false
  /messages/{messageId}:
    get:
      summary: Get a message
      description: Use this endpoint to get details about a message that was sent.
      operationId: get-a-message
      parameters:
        - name: messageId
          in: path
          schema:
            type: integer
            format: int32
          required: true
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: components.yml#/components/responses/BadRequest
        "401":
          $ref: components.yml#/components/responses/Unauthorized
      deprecated: false
components:
  schemas:
    Message:
      type: object
      properties:
        messageId:
          type: integer
          format: int32
          example: 26646440
          description: The unique identifier of the message.
        agentId:
          type: integer
          format: int32
          example: 107306
          description: The agentId of the agent that's either receiving or sending the message.
        clientId:
          type: integer
          format: int32
          example: 190073
          description: The clientId of the client that's either receiving or sending the message.
        sender:
          type: string
          example: agent
          description: "Indicates whether the agent sent the message or the client. Allowed values: agent, client"
        source:
          type: string
          example: api
          description: Indicates how the message was created (e.g. via the API or another channel).
        token:
          type: string
          description: An opaque token associated with this message.
        content:
          type: object
          properties:
            listings:
              type: array
              description: An array of listings (mlsNumbers) sent in this message.
              items:
                type: string
                example: C1234567
            searches:
              type: array
              description: An array of saved searches (searchIds) sent in this message.
              items:
                type: integer
                format: int32
                example: 107167
            message:
              type: string
              example: Hi, how are you today?
              description: The text content of this message.
            subject:
              type: string
              nullable: true
              description: The email subject, if this message changed it from the default.
            links:
              type: array
              description: An array of links (URLs) sent in this message.
              items:
                type: string
                example: https://example.com/resource/123
            pictures:
              type: array
              description: An array of pictures (URLs) sent in this message.
              items:
                type: string
                example: https://example.com/resource/123
        delivery:
          type: object
          properties:
            scheduleDateTime:
              type: string
              nullable: true
              description: The date/time this message is scheduled to be sent, if scheduled for later delivery.
            sentDateTime:
              type: string
              example: "2024-06-15T12:00:00.000Z"
              description: The date/time this message was sent.
            status:
              type: string
              example: sent
              description: The delivery status of this message.
